# Builds the adev showcase deck and publishes it to GitHub Pages at https://slide-ng.github.io/themes/
# Turn it on once: Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - examples/**
      - packages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: slide-ng/slide.ng
          path: core
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm ci
        working-directory: core

      - name: Build the five showcase decks
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          mkdir -p dist-pages
          for name in adev seriph shibainu bricks apple-basic; do
            awk 'NR == 1 { print; print "routerMode: hash"; next } { print }' "examples/$name.md" > "examples/_pages-$name.md"
            node core/bin/slide-ng.mjs build "examples/_pages-$name.md" --base "/$repo/$name/" --out "dist-pages/$name"
            rm "examples/_pages-$name.md"
          done
          cp pages/index.html dist-pages/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - id: deployment
        uses: actions/deploy-pages@v5
